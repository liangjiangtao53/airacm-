# 公共反代头 — 被 airacm.conf 各 location include
# 后端 NestJS 设了 trust proxy=1,依赖 X-Forwarded-* 取真实 IP(限流/日志)。
# 依赖主配置 http{} 块内定义的 map $http_upgrade $connection_upgrade(见 airacm.conf 顶部)。

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE 兼容(Next 部分场景);非 ws 时 $connection_upgrade 为空,兼容 upstream keepalive
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# 超时
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# 缓冲
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 16k;

# 维修之翼 — Nginx 反向代理(生产)
# 架构: 公网 443 → nginx(TLS终止) → / 前端(next start :3000) + /api/ 后端(:8770)
#
# 部署步骤:
#   1. 替换下方所有 TODO(域名 / 证书路径)
#   2. 前端: cd frontend && npm run build && PORT=3000 npm run start   (生产严禁 next dev)
#      前端环境变量: NEXT_PUBLIC_API_BASE=/api   (同域,免跨域;构建前写入 .env.production)
#   3. 后端: docker compose up -d   (api 监听 8770,Postgres 仅容器内网)
#   4. 防火墙: 仅开 80/443;关闭 3000 / 8770 / 5432 的公网入站
#   5. 拷贝本文件与 airacm_proxy_common.conf 到 /etc/nginx/conf.d/
#      nginx -t && systemctl reload nginx

# ===== 以下 limit_*_zone 必须位于 http{} 块。若服务器 nginx.conf 用 include conf.d/*.conf
#       在 http 块内引入本文件,则此处生效;否则把这三行移到 nginx.conf 的 http{} 顶部。 =====
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=30r/s;  # 普通接口 30 req/s
limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=1r/s;   # 登录/发码 1 req/s,防爆破
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;             # 并发连接

# WebSocket 升级时 Connection: upgrade,否则置空(兼容 upstream keepalive)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# docker compose 部署: 指向容器服务名。
# 若用宿主机系统 nginx(非容器),改成 127.0.0.1:3000 / 127.0.0.1:8770。
upstream airacm_frontend { server frontend:3000; keepalive 32; }
upstream airacm_backend  { server api:8770; keepalive 32; }

# ---- HTTP → HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name weixiuzhiyi.com.cn www.weixiuzhiyi.com.cn;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }  # Let's Encrypt 续期
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weixiuzhiyi.com.cn www.weixiuzhiyi.com.cn;

    # ---- TLS ----
    # 证书由 compose 挂载 deploy/nginx/certs → /etc/nginx/certs(只读)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 腾讯云 TrustAsia 证书链在 alpine nginx 内做 OCSP stapling verify 会缺本地 issuer,
    # 生产 HTTPS 证书本身仍有效；这里关闭 stapling，避免握手阶段被 OCSP 校验干扰。
    ssl_stapling off;
    ssl_stapling_verify off;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- 安全响应头(经反代以 nginx 为准) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: Next.js 运行时需内联;如需更严改 nonce 方案。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # ---- body 上限(全局收紧,上传路径单独放大) ----
    client_max_body_size 2m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    limit_conn conn_per_ip 50;

    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript image/svg+xml;

    # ---- Next 静态资源强缓存 ----
    location /_next/static/ {
        proxy_pass http://airacm_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- App 安装包下载 ----
    # 管理后台上传到共享目录;nginx 直接读取,避免前端镜像内旧文件导致下载不同步。
    location /downloads/app/ {
        alias /usr/share/nginx/html/downloads/app/;
        autoindex off;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # ---- 后端 API ----
    # 认证敏感端点: 严格限流 + rewrite 剥离 /api 前缀
    # (正则 location 不能靠 proxy_pass 尾斜杠改写 URI,必须用 rewrite break)
    location ~ ^/api/auth/(login|send-code|register|key-login)$ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://airacm_backend;
        include /etc/nginx/conf.d/airacm_proxy_common.conf;
    }

    # 题库 Excel 导入: 放大 body
    location = /api/admin/questions/import {
        client_max_body_size 150m;
        client_body_timeout  120s;
        limit_req zone=api_general burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://airacm_backend;
        include /etc/nginx/conf.d/airacm_proxy_common.conf;
    }

    # M1 整包预检:后端文件上限为 5MiB,为 multipart 边界预留少量空间。
    location = /api/admin/questions/m1/preflight {
        client_max_body_size 6m;
        client_body_timeout  120s;
        limit_req zone=api_general burst=3 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://airacm_backend;
        include /etc/nginx/conf.d/airacm_proxy_common.conf;
    }

    # App APK 上传:安装包通常远大于全局 2m body 上限。
    location = /api/admin/app/apk {
        client_max_body_size 150m;
        client_body_timeout  300s;
        limit_req zone=api_general burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://airacm_backend;
        include /etc/nginx/conf.d/airacm_proxy_common.conf;
    }

    # 其余 API: 前缀 location,proxy_pass 尾 / 剥离 /api
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://airacm_backend/;
        include /etc/nginx/conf.d/airacm_proxy_common.conf;
    }

    # ---- 前端兜底 ----
    location / {
        proxy_pass http://airacm_frontend;
        include /etc/nginx/conf.d/airacm_proxy_common.conf;
    }
}

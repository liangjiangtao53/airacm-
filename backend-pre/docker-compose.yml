services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-airacm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_DATABASE:-airacm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-airacm}']
      interval: 5s
      timeout: 3s
      retries: 10
    # 不对公网暴露 5432;仅容器网络内访问。

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-8770}:8770'

volumes:
  pgdata:

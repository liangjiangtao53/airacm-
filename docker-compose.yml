# 维修之翼整套部署:
#   nginx exposes 80/443; db/api/frontend stay inside the compose network.
#   Required .env values: DB_ROOT_PASSWORD, DB_PASSWORD, JWT_SECRET,
#   ADMIN_PASSWORD, BIZ_ADMIN_PASSWORD.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${DB_DATABASE:-airacm}
      MYSQL_USER: ${DB_USER:-airacm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - '3306'

  api:
    build: ./backend-pre
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-airacm}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_DATABASE: ${DB_DATABASE:-airacm}
      DB_SYNC: ${DB_SYNC:-false}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_APK_PATH: /app/uploads/app/airacm-android.apk
      QUESTION_IMAGE_DIR: /app/uploads/question-images
      QUESTION_IMPORT_DIR: /app/uploads/question-imports
      CUSTOMER_SERVICE_QR_PATH: /app/uploads/customer-service/customer-service-qr.png
      SMS_DEV_MODE: ${SMS_DEV_MODE:-false}
      ALI_SMS_AK_ID: ${ALI_SMS_AK_ID:-}
      ALI_SMS_AK_SECRET: ${ALI_SMS_AK_SECRET:-}
      ALI_SMS_SIGN: ${ALI_SMS_SIGN:-}
      ALI_SMS_TEMPLATE: ${ALI_SMS_TEMPLATE:-}
      WECHAT_MINI_ENABLED: ${WECHAT_MINI_ENABLED:-false}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:-}
      WECHAT_MINI_CONTENT_SECURITY_ENABLED: ${WECHAT_MINI_CONTENT_SECURITY_ENABLED:-false}
      WECHAT_MINI_TIMEOUT_MS: ${WECHAT_MINI_TIMEOUT_MS:-5000}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BIZ_ADMIN_PHONE: ${BIZ_ADMIN_PHONE:-}
      BIZ_ADMIN_PASSWORD: ${BIZ_ADMIN_PASSWORD:-}
    volumes:
      - ${APP_UPLOAD_DIR:-./uploads/app}:/app/uploads/app
      - ${QUESTION_IMAGE_DIR:-./uploads/question-images}:/app/uploads/question-images
      - ${QUESTION_IMPORT_DIR:-./uploads/question-imports}:/app/uploads/question-imports
      - ${CUSTOMER_SERVICE_QR_DIR:-./uploads/customer-service}:/app/uploads/customer-service:ro
    expose:
      - '8770'
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    expose:
      - '3000'
    volumes:
      - ${APP_UPLOAD_DIR:-./uploads/app}:/app/public/downloads/app:ro
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/airacm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/airacm_proxy_common.conf:/etc/nginx/conf.d/airacm_proxy_common.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/certbot:/var/www/certbot
      - ${APP_UPLOAD_DIR:-./uploads/app}:/usr/share/nginx/html/downloads/app:ro
    depends_on:
      - api
      - frontend

volumes:
  mysql_data:
